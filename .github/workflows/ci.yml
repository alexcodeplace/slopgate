name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slopgate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SLOPGATE_BUILD_REVISION: ${{ github.sha }}

jobs:
  quality:
    name: Slopgate quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  architecture:
    name: Slopgate architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo test --locked -p slopgate-architecture
      - run: cargo run --locked -p slopgate-architecture -- --root .
      - run: python3 scripts/test_spec_drift.py
      - name: Proposed metadata drift review
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/spec_drift.py --base "$BASE_SHA" --head "$HEAD_SHA"

  test:
    name: Slopgate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: linux-x64
            exe: ''
          - name: macOS
            os: macos-15
            target: aarch64-apple-darwin
            key: darwin-arm64
            exe: ''
          - name: Windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            key: win32-x64
            exe: .exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Provision pinned fixture compilers and native AST engine
        run: node scripts/provision-test-tools.mjs
      - name: Workspace and process-lifecycle tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Real executable and compiler acceptance
        run: python tests/acceptance/test_universal.py --binary "target/debug/slopgate-rs${{ matrix.exe }}"
      - name: Build shipped release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" -p slopgate-rs
      - name: Stage and smoke matching platform
        run: |
          node scripts/build-npm-packages.mjs --stage "${{ matrix.key }}"
          node scripts/build-npm-packages.mjs --smoke "${{ matrix.key }}"
      - name: Packaged launcher and consumer acceptance
        run: python tests/acceptance/test_package.py --binary "target/${{ matrix.target }}/release/slopgate-rs${{ matrix.exe }}"

  performance:
    name: Slopgate performance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node scripts/provision-test-tools.mjs
      - run: cargo build --release --locked -p slopgate-rs
      - name: Enforce release performance budgets
        run: python3 scripts/benchmark.py --binary target/release/slopgate-rs --semantic --output artifacts/performance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: slopgate-performance
          path: artifacts/performance.json
          if-no-files-found: error

  workflow-quality:
    name: Slopgate workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
