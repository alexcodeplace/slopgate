[package]
name = "slopgate-core"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
fancy-regex = "0.18"
walkdir = { workspace = true }
tempfile = { workspace = true }
toml = "1.1.2"
indexmap = "2"

process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }

time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
