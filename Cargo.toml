[workspace]
resolver = "2"
members = ["crates/slopgate-core", "crates/slopgate-rs", "tools/leakscan"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
toml = { path = "/home/user/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/toml-0.8.23" }
walkdir = "2"
tempfile = "3"
